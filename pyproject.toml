[project]
name = "hydroexa-dev"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "pyhydroexa",
]

[tool.uv.sources]
pyhydroexa = { workspace = true }

[tool.uv.workspace]
members = ["PyHydroEXA"]
# docs/ is its own uv project, deliberately outside this workspace.  A workspace
# sync installs every member's dependency tree, which for pyhydroexa includes
# GDAL, yt and rasterio -- none of which the documentation build touches.
# `exclude` keeps `uv sync` here from ever walking into docs/, and keeps
# `uv sync` in docs/ from resolving this project.
exclude = ["docs"]
