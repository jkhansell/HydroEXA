name: docs

# Builds the single Sphinx tree in docs/ (design notes + Python API + C++ API)
# and publishes it to GitHub Pages.
#
# Blocking: the C++ doc-comment pass is complete, so the Doxyfile treats an
# undocumented entity as an error (WARN_IF_UNDOCUMENTED + WARN_AS_ERROR) and
# Sphinx runs with -W.  A doc comment that goes missing fails the build rather
# than printing a warning into the log.
#
# Branches: `develop` integrates and `main` releases.  Both build and both
# deploy -- `develop` keeps the published site current with integration work,
# and `main` republishes the same tree at release time.  Deployments share the
# `pages` concurrency group, so they are serialised and the newest push is what
# is live.  A pull request only builds.
#
# Environment: docs/pyproject.toml, a uv project outside the repository
# workspace.  Resolving the workspace instead installs the solver's runtime
# dependencies (fiona, GDAL, yt) to build a website, which is how this job once
# failed on a missing wheel for the runner's Python.

on:
  push:
    branches: [develop, main]
  pull_request:
    paths:
      - "docs/**"
      - "include/**"
      - "src/**"
      - "PyHydroEXA/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No submodules: the docs build reads `include/` for Doxygen and the
      # Python sources for autodoc, and touches neither tpl/amrex nor
      # tpl/hdf5.  Cloning them costs a minute and couples this job to
      # third-party history it does not use.
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install doxygen and graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install documentation dependencies
        run: cd docs && uv sync --locked

      - name: Doxygen XML (C++ API)
        run: cd docs/doxygen && doxygen Doxyfile

      - name: Sphinx HTML
        run: cd docs && uv run --locked sphinx-build -b html -W --keep-going . _build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    # Both long-lived branches publish.  A pull request, or any future trigger,
    # is not named here and therefore does not deploy: publishing is opted into
    # deliberately.
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
