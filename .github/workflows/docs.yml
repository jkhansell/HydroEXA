name: docs

# Builds the single Sphinx tree in docs/ (design notes + Python API + C++ API)
# and publishes it to GitHub Pages.
#
# Advisory by design: the HTML is built and deployed even when Sphinx reports
# warnings, because the doc-comment pass on the C++ headers is still pending.
# Once `docs/doxygen/Doxyfile` sets WARN_IF_UNDOCUMENTED=YES, promote the build
# step to blocking by deleting `continue-on-error` and adding `-W` (the
# Makefile already passes it via SPHINXOPTS).

on:
  push:
    branches: [AmrCore_refactor, main]
  pull_request:
    paths:
      - "docs/**"
      - "include/**"
      - "src/**"
      - "PyHydroEXA/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen and graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install documentation dependencies
        run: uv sync --group docs

      - name: Doxygen XML (C++ API)
        run: cd docs/doxygen && doxygen Doxyfile

      - name: Sphinx HTML
        continue-on-error: true   # advisory until the doc-comment pass lands
        run: uv run sphinx-build -b html docs docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/AmrCore_refactor' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
